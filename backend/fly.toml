app = "big-route-weather-api"
primary_region = "dfw"

[build]

[env]
  CONNECTION_STRING = "Data Source=/data/routeweather.db"
  FrontendOrigin = "https://bigrouteweather.com"
  ASPNETCORE_ENVIRONMENT = "Production"

[[mounts]]
  source = "routeweather_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
