<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Big Route Weather</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Climbing and mountaineering weather forecasts and route-condition grades for big peaks.">
  <meta property="og:site_name" content="Big Route Weather">
  <meta property="og:image" content="https://bigrouteweather.com/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <script>
    // Stamp the theme before first paint so a stored light preference never
    // flashes dark. SettingsService adopts this same storage value on boot.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('brw.settings.v1') || 'null') || {};
        var t = s.theme === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : s.theme;
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) { /* default dark */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
