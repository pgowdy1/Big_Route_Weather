@if (loading()) {
  <p class="status">Loading conditions…</p>
} @else if (error()) {
  <div class="status error">
    <p>{{ error() }}</p>
    <button (click)="load()">Retry</button>
  </div>
} @else {
  <div class="search">
    <input
      type="search"
      placeholder="Search peaks by mountain name…"
      aria-label="Search peaks by mountain name"
      [value]="query()"
      (input)="onSearch($any($event.target).value)"
    />
  </div>
  @if (filtered().length === 0 && query().trim()) {
    <p class="status">No peaks match "{{ query().trim() }}".</p>
  } @else {
    <div class="grid">
      @for (r of filtered(); track r.slug) {
        <app-route-card [route]="r" />
      }
    </div>
  }
}
